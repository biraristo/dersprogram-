<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ders Atölyesi · Okul planlama</title><link rel="stylesheet" href="style.css">
<header><strong>▦ &nbsp; Ders Atölyesi</strong><span>Okul planlama</span></header>
<main><div class="top"><div><small>HAFTALIK PLANLAMA</small><h1 id="title">Ders programı</h1></div><button id="generate">Programı oluştur</button></div>
<nav><button data-tab="schedule">Haftalık çizelge</button><button data-tab="assignments">Ders atamaları</button><button data-tab="rules">Okul ve kurallar</button></nav>
<p id="notice" role="status"></p>
<section id="schedule"><div class="bar"><h2>Haftalık çizelge</h2><select id="view" aria-label="Çizelge görünümü"></select></div><div class="scroll"><table id="grid"></table></div><footer><button id="csv">CSV indir</button><button id="print">Yazdır / PDF</button></footer></section>
<section id="assignments" hidden><h2>Ders atamaları</h2><p>Birlikte derse giren şube veya öğretmenleri virgülle ayırın. Blokları 2+2+1 biçiminde yazın.</p><form id="lesson"><label>Ders<input name="name" required></label><label>Şubeler<input name="groups" placeholder="9/A, 9/B" required></label><label>Öğretmenler<input name="teachers" required></label><label>Derslik<input name="room"></label><label>Haftalık bloklar<input name="blocks" value="2+1" required></label><button>Atamayı kaydet</button><button type="reset">Temizle</button></form><div class="scroll"><table id="list"></table></div></section>
<section id="rules" hidden><h2>Okul ve kurallar</h2><form id="settings"><label>Okul adı<input name="school" required></label><label>Haftada gün<input name="days" type="number" min="1" max="7" required></label><label>Günde saat<input name="hours" type="number" min="1" max="16" required></label><button>Kaydet</button></form><h3>Kapalı saatler</h3><form id="closure"><label>Kaynak<select name="res"></select></label><label>Gün<select name="day"></select></label><label>Ders saati<select name="hour"></select></label><button>Saati kapat</button></form><div id="closed"></div><h3>Çalışma alanı</h3><footer><button id="backup">Yedeği indir</button><label>Yedek yükle<input id="restore" type="file" accept=".json"></label><label>Arama süresi<select id="limit"><option value="8000">8 saniye</option><option value="30000">30 saniye</option><option value="120000">2 dakika</option></select></label></footer><p id="storage"></p></section></main><script type="module" src="app.mjs"></script></html>
